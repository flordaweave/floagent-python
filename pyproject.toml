[build-system]
requires = ["setuptools>=77"]
build-backend = "setuptools.build_meta"

[project]
name = "floagent-sdk"
version = "0.1.1"
description = "Python client and framework adapters for FloAgent external apps"
readme = "README.md"
requires-python = ">=3.10"
license = "MIT"
license-files = ["LICENSE"]
authors = [{ name = "FlordaWeave" }]
keywords = ["floagent", "authentication", "handoff", "streamlit"]
classifiers = [
  "Development Status :: 3 - Alpha",
  "Programming Language :: Python :: 3",
  "Programming Language :: Python :: 3 :: Only",
  "Programming Language :: Python :: 3.10",
  "Programming Language :: Python :: 3.11",
  "Programming Language :: Python :: 3.12",
  "Programming Language :: Python :: 3.13",
  "Programming Language :: Python :: 3.14",
  "Typing :: Typed",
]
dependencies = []

[project.urls]
Homepage = "https://github.com/FlordaWeave/floagent-python"
Issues = "https://github.com/FlordaWeave/floagent-python/issues"
Source = "https://github.com/FlordaWeave/floagent-python"

[project.optional-dependencies]
streamlit = ["streamlit>=1.40,<2"]
test = ["pytest>=8,<9"]

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
floagent_sdk = ["py.typed"]

[tool.pytest.ini_options]
testpaths = ["tests"]
